name: Android

# Compile l'application Android (Capacitor) :
#  - APK de test, installable directement sur un téléphone
#  - AAB signé pour Google Play (si les secrets de signature sont renseignés)
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL de l'application (ex. https://app.votre-domaine.com)"
        required: true
        default: "https://app.direct-dialog.com"
      version_name:
        description: "Version affichée (ex. 2.5.0)"
        required: false
        default: "2.5.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK (préinstallé sur le runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Dépendances
        run: yarn install --frozen-lockfile

      - name: Application web
        run: yarn build:web

      - name: Version Android
        working-directory: apps/adcampaign-manager
        run: |
          VERSION="${{ inputs.version_name || '2.5.0' }}"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Synchronisation Capacitor
        working-directory: apps/adcampaign-manager
        env:
          CAP_SERVER_URL: ${{ inputs.server_url || vars.APP_SERVER_URL || 'https://app.direct-dialog.com' }}
        run: npx cap sync android

      - name: Signature (secrets)
        working-directory: apps/adcampaign-manager/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties
            echo "Signature configurée."
          else
            echo "Pas de secrets de signature : APK de test uniquement."
          fi

      - name: Compilation APK de test
        working-directory: apps/adcampaign-manager/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Compilation AAB (Play Store)
        working-directory: apps/adcampaign-manager/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: direct-dialog-android
          path: |
            apps/adcampaign-manager/android/app/build/outputs/apk/debug/app-debug.apk
            apps/adcampaign-manager/android/app/build/outputs/bundle/release/app-release.aab

      - name: Publier l'APK dans la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/adcampaign-manager/android/app/build/outputs/apk/debug/app-debug.apk
          name: DIRECT DIALOG ${{ github.ref_name }}
          fail_on_unmatched_files: false
