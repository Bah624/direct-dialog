name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilation et tests de fumée
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Installer les dépendances
        run: yarn install --frozen-lockfile

      - name: Compiler l'interface et le serveur
        run: yarn build

      - name: Vérifier l'authentification et les endpoints
        run: |
          set -e
          export ADMIN_PASSWORD='ci-mot-de-passe-2026'
          PORT=8137 node server/dist/server.mjs &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8137/healthz >/dev/null; then break; fi
            sleep 1
          done

          echo "— sans session, l'API doit refuser"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8137/api/getClients \
            -H 'Content-Type: application/json' -d '{"inputs":{}}')
          echo "getClients sans session → $code"
          [ "$code" = "401" ]

          echo "— connexion administrateur"
          curl -fsS -c /tmp/cookies.txt -X POST http://127.0.0.1:8137/api/auth/connexion \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@direct-dialog.local\",\"motDePasse\":\"$ADMIN_PASSWORD\"}" >/dev/null

          echo "— endpoints métier"
          for ep in getDashboard getClients getCampagnes getEmplacements getReservations \
                    getImpressions getFactures getStock getSorties getCollaborateurs getReports \
                    getParametres getUtilisateurs; do
            code=$(curl -sS -b /tmp/cookies.txt -o /dev/null -w '%{http_code}' \
              -X POST "http://127.0.0.1:8137/api/$ep" -H 'Content-Type: application/json' -d '{"inputs":{}}')
            echo "$ep → $code"
            [ "$code" = "200" ]
          done

      - name: Construire l'image Docker
        run: docker build -t direct-dialog:ci .
