name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilation et tests de fumée
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Installer les dépendances
        run: yarn install --frozen-lockfile

      - name: Compiler l'interface et le serveur
        run: yarn build

      - name: Vérifier que le serveur répond
        run: |
          PORT=8137 node server/dist/server.mjs &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8137/healthz; then exit 0; fi
            sleep 1
          done
          echo "Le serveur n'a pas répondu" >&2
          exit 1

      - name: Vérifier les endpoints de lecture
        run: |
          for ep in getDashboard getClients getCampagnes getEmplacements getReservations \
                    getImpressions getFactures getStock getSorties getCollaborateurs getReports; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:8137/api/$ep" \
              -H 'Content-Type: application/json' -d '{"inputs":{}}')
            echo "$ep → $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Construire l'image Docker
        run: docker build -t direct-dialog:ci .
